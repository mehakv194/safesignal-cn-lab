# Free-only demo: SQLite is ephemeral and may reset on restarts. No paid disk/database.
services:
  - type: web
    name: safesignal-campus
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: python -m safesignal.hosted
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SAFESIGNAL_DATA_DIR
        value: /tmp/safesignal
      - key: SAFESIGNAL_SENDER_TOKEN
        generateValue: true
      - key: SAFESIGNAL_RESPONDER_TOKEN
        generateValue: true
      - key: SAFESIGNAL_SESSION_SECRET
        generateValue: true
      - key: SAFESIGNAL_EPHEMERAL_STORAGE
        value: '1'
      - key: ENABLE_DEMO_FAULTS
        value: '0'
