{% if role=='sender' and session.get('role') %}<dialog id="report-dialog" aria-labelledby="report-title"><div class="dialog-head"><div><div class="eyebrow">CAMPUS SIMULATION</div><h2 id="report-title">Report an incident</h2></div><button class="icon-button" data-close-dialog aria-label="Close report form">{{ icon('close') }}</button></div><p>Describe a synthetic situation. Your report is saved before transmission.</p><form action="{{ url_for('submit') }}" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><div class="form-grid"><label>Incident category<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Priority<select name="severity">{% for s in severities %}<option{% if s=='LOW' %} selected{% endif %}>{{ s }}</option>{% endfor %}</select></label></div><label>What happened?<textarea name="description" aria-label="Description" minlength="10" maxlength="300" rows="4" required placeholder="TEST ONLY: describe a simulated campus incident"></textarea></label><label>Synthetic location<input name="location" maxlength="120" placeholder="e.g. Synthetic Science Block"></label><div class="form-note">{{ icon('shield') }}Use fictional details. No personal information.</div><button class="button full" type="submit">{{ icon('plus') }}Submit synthetic incident</button></form></dialog>{% endif %}
