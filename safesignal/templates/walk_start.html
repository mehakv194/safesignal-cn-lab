{% extends 'base.html' %}{% block content %}<section class="panel identity-panel"><h1>Start SafeWalk</h1><p>Plan a simulated journey. There is no GPS tracking.</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="action_id" value="{{ action_id }}"><label>From<input name="origin" required maxlength="80" placeholder="Hostel B"></label><label>To<input name="destination" required maxlength="80" placeholder="Central Library"></label><label>Expected duration<select name="duration">{% for n in [5,10,15,30,60] %}<option value="{{ n }}"{% if n==15 %} selected{% endif %}>{{ n }} minutes</option>{% endfor %}</select></label><label>Check in every<select name="interval">{% for n in [5,10,15] %}<option value="{{ n }}">{{ n }} minutes</option>{% endfor %}</select></label><p>A missed check-in has a two-minute grace period, then creates a simulated follow-up. Your safety remains unknown. No automatic real response or push notifications.</p><button class="button full">Begin SafeWalk</button></form></section>{% endblock %}
