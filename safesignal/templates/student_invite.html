{% extends 'base.html' %}
{% block content %}
<section class="panel identity-panel">
  <h1>Activate your {{ invited_role }} demo</h1>
  <p>Enter the code sent to your enrollment inbox and choose a password.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Enrollment email<input name="email" type="email" required maxlength="254" autocomplete="username"></label>
    <label>Invitation code<input name="code" required maxlength="64" autocomplete="one-time-code" spellcheck="false"></label>
    <label>New password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <button class="button full">Activate account</button>
  </form>
  <a class="text-link" href="{{ url_for('login') }}">Go to {{ invited_role }} sign-in</a>
</section>
{% endblock %}
